<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    >
    <link
      rel="stylesheet"
      href="style.css"
      media="screen"
      charset="utf-8"
    >
  </head>
  <body>
    <main>
      <section class="about">
        <img class="about__logo" src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix">
        <a class="about__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
      </section>
      <section class="container add-item">
        <h3 class="add-item__title">Add Item</h3>
        <div class="add-item-wrapper">
          <input class="add-item__input" type="text">
          <button class="add-item__button">Add</button>
        </div>
      </section>  
      <section class="container">
        <h3 class="container__title">Todo</h3>
        <ul class="incomplete-tasks">
          <li class="task-item">
            <input type="checkbox">
            <label class="task">Pay Bills</label>
            <input type="text" class="task">
            <button class="edit">Edit</button>
            <button class="delete">
              <img src="./remove.svg" alt="Remove button">
            </button>
          </li>
          <li class="edit-mode">
           <input type="checkbox">
            <label class="task">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task">
            <button class="edit">Save</button>
            <button class="delete">
              <img src="./remove.svg" alt="Remove button">
            </button>
          </li>
        </ul>
      </section> 
      <section class="container">
        <h3 class="container-title">Completed</h3>
        <ul id="completed-tasks">
          <li>
            <input type="checkbox" checked>
            <label class="task">See the Doctor</label>
            <input type="text" class="task">
            <button class="edit">Edit</button>
            <button class="delete">
              <img src="./remove.svg" alt="Remove button">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
